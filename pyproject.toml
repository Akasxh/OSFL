[project]
name = "osfl"
version = "0.1.0"
description = "OSFL — outcome = probability × volume. A Monte-Carlo life-planning engine with a digital-twin persona layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
osfl = "osfl.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

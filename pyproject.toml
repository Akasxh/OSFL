[project]
name = "osfl"
version = "0.1.0"
description = "OSFL — outcome = probability × volume. A Monte-Carlo life-planning engine with a digital-twin persona layer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akash" }]
keywords = ["monte-carlo", "bayesian", "forecasting", "fastapi", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openai>=2.40.0",
]

[project.urls]
Repository = "https://github.com/Akasxh/OSFL"
Issues = "https://github.com/Akasxh/OSFL/issues"

[project.scripts]
osfl = "osfl.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osfl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.155.1",
    "pytest-playwright>=0.8.0",
]

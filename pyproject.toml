[project]
name = "osfl"
version = "0.1.0"
description = "OSFL — outcome = probability × volume. A Monte-Carlo life-planning engine with a digital-twin persona layer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akash" }]
keywords = ["monte-carlo", "bayesian", "forecasting", "fastapi", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=2.40.0",
]

[project.urls]
Repository = "https://github.com/Akasxh/OSFL"
Issues = "https://github.com/Akasxh/OSFL/issues"

[project.scripts]
osfl = "osfl.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osfl"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.155.1",
    "pytest-playwright>=0.8.0",
    "ruff>=0.14",
    "mypy>=1.13",
    "mutmut>=3.2",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# E501 (line length) is owned by `ruff format` (enforced via `ruff format --check`
# in CI); leaving it on only mis-fires on intentional one-line LLM-prompt strings.
ignore = ["E501"]
# Deliberate maths glyphs in docstrings ("probability × volume", "8% → 40%").
allowed-confusables = ["×", "→", "≥", "≤", "≈"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and the E2E harness spawns the server (S603) and polls
# its localhost URL (S310) — all legitimate, trusted-input test infrastructure.
"tests/**" = ["S101", "S603", "S310"]

[tool.mypy]
python_version = "3.12"
files = ["osfl"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
# numpy's typed API leaks Any through array arithmetic; the engine is covered
# by property + value tests, so don't force casts that would obscure the math.
module = "osfl.engine.*"
warn_return_any = false

[tool.mutmut]
paths_to_mutate = "osfl/engine/"
tests_dir = "tests/"
runner = "uv run pytest tests/test_engine.py tests/test_engine_props.py tests/test_engine_guards.py -q -x"
